name: AgriSense Backend CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agrisense_db
          POSTGRES_USER: agrisense_user
          POSTGRES_PASSWORD: agrisense_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: 'test-ci-secret-key'
          DEBUG: '0'
          DATABASE_URL: 'postgres://agrisense_user:agrisense_pass@localhost:5432/agrisense_db'
          REDIS_URL: 'redis://localhost:6379/0'
        run: |
          cd backend
          python manage.py migrate
          pytest
